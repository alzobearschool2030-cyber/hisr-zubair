<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a4f47">
<title>شواهدي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#16302c;--mut:#5d7570;--line:#dfe8e5;--g:#0d6b5f;--g2:#0a4f47;--gold:#c8a24a;--ok:#1f9d55;--warn:#d9822b;--bad:#c0392b;--blue:#2563a8;--r:16px;--dc:#0d6b5f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.65;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.ic{flex:none;vertical-align:-3px}
.hd{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px}
.hd-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;flex:none}
.logo svg{width:100%;height:100%;display:block}
.brand h1{margin:0;font-size:26px;line-height:1.1;font-weight:800}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
.hd-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.today{font-size:13px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px}
.chipbtn,.icbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px}
.icbtn{padding:7px;display:grid;place-items:center}
.nv{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(10,79,71,.06)}
.nv-in{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.nv-in::-webkit-scrollbar{display:none}
.nv a{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;color:var(--mut)}
.nv a.on{background:var(--g2);color:#fff;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(10,79,71,.05)}
.banner{background:#fff7e0;border:1px solid #ecd9a0;color:#6b5513;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.err{background:#fdecea;border-color:#f3b8b1;color:#8a2a20}
h3{margin:0 0 10px;font-size:18px}
h4{margin:0;font-size:16px;line-height:1.5}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero .t{flex:1;min-width:220px}
.hero .t h2{margin:0 0 4px;font-size:22px}
.hero .t p{margin:0;color:var(--mut);font-size:14px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kpi{background:var(--bg);border-radius:12px;padding:8px 14px;min-width:92px;text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.2}
.kpi small{color:var(--mut);font-size:12px}
.dgrid{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:14px}
.dc{display:block;border-top:5px solid var(--dc);transition:transform .15s}
.dc:hover{transform:translateY(-2px)}
.dc-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.dc-t b{font-size:18px;color:var(--dc)}
.dc-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.dc-g b{display:block;font-size:18px}
.dc-g small{color:var(--mut);font-size:12px}
.ext{margin-top:10px;font-size:12.5px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .dot{width:10px;height:10px;border-radius:50%;background:var(--dc);flex:none}
.li b{display:block;font-size:14.5px}
.li small{color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
.dh{border-top:6px solid var(--dc);margin-bottom:12px}
.dh h2{margin:0 0 4px;font-size:22px;color:var(--dc)}
.dh .sub{color:var(--mut);font-size:13.5px}
.tools{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:10px;padding:12px}
.tools input{grid-column:1/-1}
input,select,textarea{width:100%;background:#fff;border:1px solid #cfdcd8;border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(13,107,95,.14)}
input:disabled{background:#f1f5f4;color:var(--mut)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:500;margin-bottom:10px;color:var(--ink)}
label input,label select,label textarea{margin-top:4px;font-weight:400}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid #cfdcd8;background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:14.5px}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.btn.danger{color:var(--bad);border-color:#efc4be}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.schips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.schips::-webkit-scrollbar{display:none}
.sc{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.sc.on{background:var(--dc);border-color:var(--dc);color:#fff}
.sg{margin:18px 0 8px}
.sg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-right:5px solid var(--dc);padding:4px 12px;background:#fff;border-radius:10px}
.sg-h b{font-size:16px}
.sg-h small{color:var(--mut);display:block;font-size:12.5px}
.sg-h .avg{font-weight:800;color:var(--dc);white-space:nowrap}
.mh{margin:14px 4px 6px;font-size:13px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:8px}
.mh::after{content:'';flex:1;height:1px;background:var(--line)}
.pgrid{display:grid;gap:10px;grid-template-columns:1fr}
.pc{background:#fff;border:1px solid var(--line);border-right:4px solid var(--dc);border-radius:14px;padding:12px 14px;cursor:pointer;transition:box-shadow .15s}
.pc:hover{box-shadow:0 4px 14px rgba(10,79,71,.12)}
.pc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pid{font-size:12px;color:var(--mut);font-weight:700}
.chip{font-size:12px;padding:1px 10px;border-radius:99px;background:#eef3f2;color:var(--mut);white-space:nowrap}
.chip.now,.chip.green{background:#dff3e8;color:#17703d}
.chip.soon,.chip.blue{background:#e1ecf8;color:#1c4f87}
.chip.done,.chip.gray{background:#eceeee;color:#566}
.chip.red{background:#fde4e0;color:#a52f23}
.chip.sem{background:#f3ecd7;color:#7a6120}
.meta{font-size:13px;color:var(--mut);margin-top:3px}
.bar{height:8px;background:#e6eeec;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--dc);border-radius:99px;transition:width .3s}
.bar.big{height:12px}
.nums{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.nums b{color:var(--dc)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-size:12px;padding:2px 10px;border-radius:8px;background:#f3f6f5;color:var(--mut);display:inline-flex;gap:4px;align-items:center}
.tg.ok{background:#dff3e8;color:#17703d}
.ov{position:fixed;inset:0;background:rgba(10,30,27,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.top{z-index:70}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;border-top:6px solid var(--dc)}
.sh-hd{padding:14px 16px 8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sh-hd h3{margin:4px 0 0;font-size:18px;line-height:1.5}
.x{border:0;background:#eef3f2;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;font-size:14.5px}
.tabs button.on{color:var(--dc);border-bottom-color:var(--dc);font-weight:800}
.sh-bd{padding:14px 16px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto}
.pane{display:none}
.pane.on{display:block}
.dl{display:grid;gap:8px;margin:0 0 14px}
.dl div{background:var(--bg);border-radius:10px;padding:8px 12px}
.dl dt{font-size:12px;color:var(--mut)}
.dl dd{margin:0;font-size:14.5px}
.dl small{display:block;color:var(--mut);font-size:12.5px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h4{margin-bottom:10px;color:var(--dc)}
.row2{display:grid;gap:10px;grid-template-columns:1fr}
.row3{display:grid;gap:10px;grid-template-columns:1fr}
.hint{font-size:12.5px;color:var(--mut);margin:6px 0 10px}
.hp-r{display:grid;grid-template-columns:.7fr 1.5fr 1fr;gap:6px;margin-top:4px}
.hp-r select{padding:9px 6px}
.hp-l{display:block;margin-top:4px;font-size:12.5px;color:var(--g2);font-weight:500}
.hp-l.bad{color:var(--bad)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cmp div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.cmp b{font-size:22px;display:block}
.cmp small{color:var(--mut)}
.gain{padding:10px 14px;border-radius:12px;font-weight:700;text-align:center;margin-bottom:10px}
.gain.up{background:#dff3e8;color:#17703d}
.gain.dn{background:#fde4e0;color:#a52f23}
.gain.eq{background:#eceeee;color:#566}
.drop{border:2px dashed #b9cdc8;border-radius:14px;padding:16px;text-align:center;background:#f8fbfa;margin-bottom:10px}
.drop.hot{border-color:var(--g);background:#eaf6f3}
.drop .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.drop small{color:var(--mut);display:block;margin-top:8px;font-size:12px}
.picked{display:grid;gap:6px;margin-bottom:10px}
.pk{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13.5px}
.pk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk button{border:0;background:none;color:var(--bad);cursor:pointer}
.ev{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.ev-th{width:56px;height:56px;border-radius:10px;background:var(--bg);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mut)}
.ev-th img{width:100%;height:100%;object-fit:cover}
.ev-b{flex:1;min-width:0}
.ev-b b{display:block;font-size:14.5px;word-break:break-word}
.ev-b small{display:block;color:var(--mut);font-size:12.5px;word-break:break-word}
.ev-b p{margin:4px 0 0;font-size:13.5px}
.ev-a{display:flex;flex-direction:column;gap:6px}
.dlg{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow-y:auto}
.dlg h3{margin-bottom:12px}
.dlg .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lb{max-width:96vw;max-height:92vh;background:#000;border-radius:12px;overflow:hidden;position:relative}
.lb img{display:block;max-width:96vw;max-height:84vh;margin:0 auto}
.lb p{color:#fff;margin:0;padding:10px 14px;font-size:14px;background:#111}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h h2{margin:0;font-size:20px}
.cal-h small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:4px 0}
.cal .wh.we{color:#a88}
.cd{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.cd.blank{background:none;border:0;cursor:default}
.cd.we{background:#faf7f2}
.cd.act{background:#eef7f4}
.cd.today{border:2px solid var(--gold)}
.cd.sel{outline:3px solid var(--g);outline-offset:-1px}
.cd b{font-size:15px;line-height:1.1}
.cd small{font-size:10.5px;color:var(--mut);line-height:1}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.dots em{font-size:10px;font-style:normal;color:var(--mut)}
.cnt{position:absolute;left:4px;top:4px;font-size:10px;background:var(--g2);color:#fff;border-radius:99px;padding:0 6px}
.cal-l{margin-top:12px}
.cal-l h4{margin:12px 0 4px;font-size:14px;color:var(--mut)}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:30px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(30px);background:#16302c;color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;place-items:center;z-index:98;font-weight:700}
#busy.on{display:grid}
#printSheet{display:none}
.spin{width:22px;height:22px;border:3px solid #cfe;border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-5px;margin-left:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:720px){
  .dgrid{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .tools{grid-template-columns:2fr 1fr 1fr 1fr}
  .tools input{grid-column:auto}
  .pgrid{grid-template-columns:1fr 1fr}
  .ov{align-items:center}
  .sheet{border-radius:22px;max-height:90vh}
  .dlg{border-radius:22px}
  .dl{grid-template-columns:1fr 1fr}
  .dl .full{grid-column:1/-1}
  .row2{grid-template-columns:1fr 1fr}
  .row3{grid-template-columns:1fr 1fr 1fr}
  .cd{min-height:84px;padding:6px}
}
@media(min-width:1000px){.dgrid{grid-template-columns:repeat(4,1fr)}}
.wdn{display:block;font-size:10.5px;color:var(--g2);font-style:normal;font-weight:700;line-height:1.2}
.rp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;max-width:900px;margin:0 auto;font-size:14.5px}
.rp-head img{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:12px}
.rp-school{text-align:center;font-weight:800;font-size:16px;margin:4px 0 2px}
.rp-title{text-align:center;font-size:20px;font-weight:800;color:var(--dc,#0d6b5f);margin:4px 0 14px}
.rp table{width:100%;border-collapse:collapse;margin-bottom:12px}
.rp th,.rp td{border:1px solid #c9d8d4;padding:7px 9px;vertical-align:top;text-align:right}
.rp th{background:#eef5f3;font-weight:700;width:24%}
.rp h4{margin:16px 0 6px;color:var(--dc,#0d6b5f)}
.rp textarea{min-height:70px}
.rp-sign{display:flex;justify-content:space-between;gap:20px;margin-top:24px;text-align:center;font-size:14px}
.rp-sign div{flex:1}
@media print{.rp{border:0;padding:0;max-width:none}.rp textarea{border:1px solid #bbb;resize:none}}
@media print{
  body{background:#fff}
  #modalRoot,#dlgRoot,#toast,#busy,.no-print{display:none!important}
  #app{display:none!important}
  body.is-report #app{display:block!important}
  body.is-report #printSheet{display:none!important}
  #printSheet{display:block!important;font-size:11px;color:#000}
  #printSheet h2{margin:0 0 4px;font-size:16px}
  #printSheet p{margin:0 0 10px;color:#444}
  #printSheet table{width:100%;border-collapse:collapse}
  #printSheet th,#printSheet td{border:1px solid #888;padding:3px 5px;vertical-align:top;text-align:right}
  #printSheet th{background:#e8efed}
  #printSheet tr.gh td{background:#f4ecd3;font-weight:700}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="empty"><span class="spin"></span> جاري تحميل شواهدي…</p></div></div>
<div id="modalRoot"></div>
<div id="dlgRoot"></div>
<div id="printSheet"></div>
<div id="busy"><div><span class="spin"></span><span id="busyMsg">جاري الحفظ…</span></div></div>
<div id="toast"></div>
<noscript>يحتاج التطبيق إلى تفعيل جافاسكربت.</noscript>

<script src="config.js"></script>
<script src="plan-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
'use strict';
const CFG = Object.assign({ BUCKET: 'shawahidi', ADMIN_PIN: '1448', MAX_FILE_MB: 25, SCHOOL: 'مدرسة الزبير بن العوام الابتدائية', PRINCIPAL: 'عبدالله خضير المخلفي', YEAR: 1448, ACCESS_PASSWORD_HASH: '', SCHOOL_EMAIL_DOMAINS: [] }, window.SHAWAHIDI_CONFIG || {});
const PLAN = window.PLAN;
const SETUP_SQL = `create table if not exists public.sh_programs (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists public.sh_state (program_id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists public.sh_evidence (id text primary key, program_id text not null, kind text, title text, note text, link text, file_path text, file_name text, mime text, size bigint, added_by text, device text, event_date text, created_at timestamptz not null default now());
create index if not exists sh_evidence_program_idx on public.sh_evidence (program_id);
alter table public.sh_programs enable row level security;
alter table public.sh_state enable row level security;
alter table public.sh_evidence enable row level security;
drop policy if exists sh_programs_all on public.sh_programs;
create policy sh_programs_all on public.sh_programs for all to anon, authenticated using (true) with check (true);
drop policy if exists sh_state_all on public.sh_state;
create policy sh_state_all on public.sh_state for all to anon, authenticated using (true) with check (true);
drop policy if exists sh_evidence_all on public.sh_evidence;
create policy sh_evidence_all on public.sh_evidence for all to anon, authenticated using (true) with check (true);
insert into storage.buckets (id, name, public, file_size_limit) values ('shawahidi', 'shawahidi', true, 52428800) on conflict (id) do nothing;
drop policy if exists shawahidi_read on storage.objects;
create policy shawahidi_read on storage.objects for select to anon, authenticated using (bucket_id = 'shawahidi');
drop policy if exists shawahidi_insert on storage.objects;
create policy shawahidi_insert on storage.objects for insert to anon, authenticated with check (bucket_id = 'shawahidi');
drop policy if exists shawahidi_delete on storage.objects;
create policy shawahidi_delete on storage.objects for delete to anon, authenticated using (bucket_id = 'shawahidi');
notify pgrst, 'reload schema';`;
const $ =(s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AD = '٠١٢٣٤٥٦٧٨٩';

  return `<div class="banner err"><b>قاعدة البيانات تحتاج تهيئة لمرة واحدة فقط</b><br>جداول شواهدي لم تُنشأ بعد في مشروع Supabase، ولذلك تُعرض برامج الخطة الآن دون حفظ أي تغيير. التهيئة تستغرق دقيقة: أولاً اضغط «نسخ أمر الإعداد»، ثانياً اضغط «فتح محرر SQL» وسجّل دخولك إلى Supabase إن طُلب منك، ثالثاً الصق ما نسخته في المحرر واضغط زر Run، رابعاً ارجع إلى هنا وسيتحقق التطبيق تلقائياً أو اضغط «تحقق مرة أخرى».
  <div class="acts" style="margin:10px 0 0"><button class="btn sm pri" data-act="copy-sql">نسخ أمر الإعداد</button><a class="btn sm" target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/${sbRef()}/sql/new">فتح محرر SQL</a><button class="btn sm" data-act="retry-load">تحقق مرة أخرى</button></div></div>`;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { try { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok; } catch (x) { return false; } }
}
function banner() {
  let b = '';
  if (S.setup) b += setupCard();
  else if (S.err) b += `<div class="banner err">${esc(S.err)}</div>`;
  if (!REMOTE) b += `<div class="banner">وضع التجربة: البيانات والملفات محفوظة على هذا الجهاز فقط. لربط التطبيق بقاعدة بيانات مشتركة لجميع المستخدمين اتبع خطوات ملف README.</div>`;
  if (!HAS_UQ) b += `<div class="banner">تعذّر تحميل تقويم أم القرى في هذا المتصفح، وتُعرض التواريخ بتقدير حسابي قد يختلف يوماً واحداً، ولن تظهر أسماء الأيام.</div>`;
  return b;
}
function render() {
  const app = $('#app');
  if (gateOn() && !authed()) { app.innerHTML = gateHTML(S.gateErr); S.gateErr = ''; return; }
  if (S.loading) { app.innerHTML = headerHTML() + '<div class="wrap"><p class="empty"><span class="spin"></span> جاري تحميل شواهدي…</p></div>'; return; }
  document.body.classList.toggle('is-report', S.route === 'r');
  if (S.route === 'r') { app.innerHTML = '<main class="wrap">' + viewReport() + '</main>'; renderModal(); renderDlg(); return; }
  let body = '';
  if (S.route === 'home') body = viewHome();
  else if (/^d[1-4]$/.test(S.route)) body = viewDomain(+S.route.slice(1));
  else if (S.route === 'cal') body = viewCal();
  else if (S.route === 'rep') body = viewReports();
  else body = viewEv();
  app.innerHTML = headerHTML() + navHTML() + `<main class="wrap">${banner()}${body}<div class="foot">شواهدي · ${esc(CFG.SCHOOL)} · الخطة التشغيلية ${ar(CFG.YEAR)}هـ · تقويم أم القرى</div></main>`;
  renderModal(); renderDlg();
}

/* ============ الرئيسية ============ */
function domCard(d) {
  const s = domainStats(d.n);
  return `<a class="dc card" href="#/d${d.n}" style="--dc:${d.color}"><div class="dc-t"><b>${d.title}</b>${ring(s.avg, 58)}</div>
  <div class="dc-g"><div><b>${ar(s.n)}</b><small>برنامج</small></div><div><b>${ar(s.files)}</b><small>شاهد</small></div><div><b>${ar(s.ev)}</b><small>برنامج موثّق</small></div><div><b>${ar(s.post)}</b><small>قياس بعدي</small></div></div>
  <div class="ext">التقويم الخارجي ${p1(d.ext)} ← المستهدف ${p1(d.tgt)}</div></a>`;
}
function liProg(p, sub) { const d = domOf(p); return `<div class="li" data-open="${p.id}" data-tab="${sub || 'info'}" style="--dc:${d.color}"><span class="dot"></span><div><b>${esc(p.name)}</b><small>${d.title} · ${rangeH(p)}</small></div></div>`; }
function viewHome() {
  const all = S.programs; const avg = all.length ? all.reduce((a, p) => a + ach(p), 0) / all.length : 0;
  const withEv = all.filter(p => evOf(p.id).length).length;
  const now = all.filter(p => timeline(p)[1] === 'now');
  const gap = now.filter(p => !evOf(p.id).length).sort((a, b) => hkey(parseH(a.to)) - hkey(parseH(b.to))).slice(0, 8);
  const rec = S.evidence.slice(0, 6);
  const sem = n => { const l = all.filter(p => p.sem === n); return l.length ? l.reduce((a, p) => a + ach(p), 0) / l.length : 0; };
  return `<section class="hero card" style="--dc:#0d6b5f">${ring(avg, 104)}<div class="t"><h2>نسبة الإنجاز العامة للخطة</h2><p>الفصل الأول ${p0(sem(1))} · الفصل الثاني ${p0(sem(2))}</p>
  <div class="kpis"><div class="kpi"><b>${ar(all.length)}</b><small>برنامج</small></div><div class="kpi"><b>${ar(S.evidence.length)}</b><small>شاهد وتقرير</small></div><div class="kpi"><b>${ar(withEv)}</b><small>برنامج له شواهد</small></div><div class="kpi"><b>${ar(now.length)}</b><small>جارٍ الآن</small></div></div></div></section>
  <section class="dgrid">${PLAN.domains.map(domCard).join('')}</section>
  <div class="two"><section class="card"><h3>برامج جارية الآن وبلا شواهد</h3>${gap.length ? gap.map(p => liProg(p, 'ev')).join('') : '<p class="empty">لا توجد برامج جارية بلا شواهد.</p>'}</section>
  <section class="card"><h3>آخر الشواهد المضافة</h3>${rec.length ? rec.map(e => { const p = S.programs.find(x => x.id === e.program_id); return p ? `<div class="li" data-open="${p.id}" data-tab="ev" style="--dc:${domOf(p).color}"><span class="dot"></span><div><b>${esc(e.title)}</b><small>${esc(p.name)} · ${esc(e.added_by || '')}</small></div></div>` : ''; }).join('') : '<p class="empty">لم تُضف شواهد بعد.</p>'}</section></div>`;
}

/* ============ صفحة المجال ============ */
function pcard(p) {
  const s = st(p.id), a = ach(p), tl = timeline(p), n = evOf(p.id).length, cur = curOf(p);
  const pre = hasM(p, 'pre'), post = hasM(p, 'post');
  return `<article class="pc" data-open="${p.id}" style="--dc:${domOf(p).color}">
  <div class="pc-top"><span class="pid">${pid(p)}</span><span class="chip sem">${p.sem === 1 ? 'الفصل الأول' : 'الفصل الثاني'}</span><span class="chip ${tl[1]}">${tl[0]}</span>${s.status ? `<span class="chip ${STC[s.status]}">${s.status}</span>` : ''}</div>
  <h4>${esc(p.name)}</h4>
  <div class="meta">${ico('cal', 14)} ${rangeH(p)}</div>
  <div class="meta">${esc(p.lead)}</div>
  <div class="bar"><i style="width:${a}%"></i></div>
  <div class="nums"><span>الحالية ${p1(cur)}</span><span>المستهدف ${p1(p.tgt)}</span><b>الإنجاز ${p0(a)}</b></div>
  <div class="tags"><span class="tg ${n ? 'ok' : ''}">${ico('clip', 13)} ${ar(n)} شاهد</span><span class="tg ${pre ? 'ok' : ''}">قياس قبلي ${pre ? '✓' : '—'}</span><span class="tg ${post ? 'ok' : ''}">قياس بعدي ${post ? '✓' : '—'}</span></div><div class="acts" style="margin:10px 0 0"><button class="btn sm" data-act="report" data-id="${esc(p.id)}">${ico('file', 15)} تقرير البرنامج</button></div></article>`;
}
function passes(p) {
  const f = S.f;
  if (f.sem && String(p.sem) !== f.sem) return false;
  if (f.tl && timeline(p)[1] !== f.tl) return false;
  if (f.ev === 'no' && evOf(p.id).length) return false;
  if (f.ev === 'yes' && !evOf(p.id).length) return false;
  if (f.q) { const t = [p.name, p.lead, p.sup, p.ind, p.who, p.how].join(' ').toLowerCase(); if (!t.includes(f.q.toLowerCase())) return false; }
  return true;
}
function groupsHTML(n) {
  const out = [];
  stdGroups(n).forEach(g => {
    if (S.f.std && g.title !== S.f.std) return;
    const list = g.list.filter(passes); if (!list.length) return;
    const avg = g.list.reduce((a, p) => a + ach(p), 0) / (g.list.length || 1);
    let h = `<section class="sg"><div class="sg-h"><div><b>${esc(g.title)}</b><small>المعيار <bdi dir="ltr">${esc(g.code)}</bdi> · ${ar(g.list.length)} برنامج</small></div><span class="avg">${p0(avg)}</span></div>`;
    let last = '';
    list.forEach(p => { const a = parseH(p.from), k = a.y + '/' + a.m; if (k !== last) { last = k; h += `<div class="mh">${MONTHS[a.m - 1]} ${ar(a.y)}هـ · ${monthGreg(a.y, a.m)}</div><div class="pgrid">`; if (false) h += ''; } h += pcard(p); const nx = list[list.indexOf(p) + 1]; if (!nx || (parseH(nx.from).y + '/' + parseH(nx.from).m) !== k) h += '</div>'; });
    out.push(h + '</section>');
  });
  return out.join('') || '<div class="card empty">لا توجد برامج مطابقة للتصفية الحالية.</div>';
}
function dynHTML(n) {
  const d = PLAN.domains[n - 1], s = domainStats(n);
  const chips = stdGroups(n).map(g => `<button class="sc ${S.f.std === g.title ? 'on' : ''}" data-std="${esc(g.title)}">${esc(g.title)}</button>`).join('');
  return `<div class="schips"><button class="sc ${S.f.std ? '' : 'on'}" data-std="">كل المعايير</button>${chips}</div>${groupsHTML(n)}`;
}
function viewDomain(n) {
  const d = PLAN.domains[n - 1], s = domainStats(n); const f = S.f;
  const o = (v, t, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${t}</option>`;
  return `<section class="dh card" style="--dc:${d.color}"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${ring(s.avg, 86)}<div style="flex:1;min-width:200px"><h2>المجال ${['الأول', 'الثاني', 'الثالث', 'الرابع'][n - 1]}: ${d.title}</h2>
  <div class="sub">نتيجة التقويم الخارجي ${p1(d.ext)} ← المستهدف ${p1(d.tgt)}</div>
  <div class="kpis"><div class="kpi"><b>${ar(s.n)}</b><small>برنامج</small></div><div class="kpi"><b>${ar(s.files)}</b><small>شاهد وتقرير</small></div><div class="kpi"><b>${ar(s.ev)}</b><small>برنامج موثّق</small></div><div class="kpi"><b>${ar(s.pre)}/${ar(s.post)}</b><small>قبلي / بعدي</small></div></div></div></div></section>
  <div class="tools card"><input id="f-q" type="search" placeholder="ابحث في البرامج أو الجهة أو المؤشر…" value="${esc(f.q)}">
  <select id="f-sem">${o('', 'كل الفصول', f.sem)}${o('1', 'الفصل الأول', f.sem)}${o('2', 'الفصل الثاني', f.sem)}</select>
  <select id="f-tl">${o('', 'كل المواعيد', f.tl)}${o('now', 'جارٍ الآن', f.tl)}${o('soon', 'قادم', f.tl)}${o('done', 'انتهى', f.tl)}</select>
  <select id="f-ev">${o('', 'كل الشواهد', f.ev)}${o('no', 'بلا شواهد', f.ev)}${o('yes', 'لها شواهد', f.ev)}</select></div>
  <div class="acts"><button class="btn" data-act="print" data-d="${n}">${ico('print', 17)} طباعة / PDF</button><button class="btn" data-act="csv-d" data-d="${n}">${ico('down', 17)} تصدير Excel</button><button class="btn pri" data-act="add-prog" data-d="${n}">${ico('plus', 17)} برنامج جديد</button></div>
  <div id="dyn" style="--dc:${d.color}">${dynHTML(n)}</div>`;
}
function paintDyn() { const el = $('#dyn'); if (el && /^d[1-4]$/.test(S.route)) el.innerHTML = dynHTML(+S.route.slice(1)); }

/* ============ التقويم الشهري (أم القرى) ============ */
function viewCal() {
  const { y, m } = S.cal, n = mlen(y, m);
  const first = H2G[y + '/' + m + '/1']; const w0 = first != null ? new Date(first).getUTCDay() : 0;
  const keyOf = d => y * 10000 + m * 100 + d;
  let cells = WD.map((w, i) => `<div class="wh ${i >= 5 ? 'we' : ''}">${w}</div>`).join('');
  for (let i = 0; i < w0; i++) cells += '<div class="cd blank"></div>';
  for (let d = 1; d <= n; d++) {
    const k = keyOf(d), wd = (w0 + d - 1) % 7;
    const act = S.programs.filter(p => hkey(parseH(p.from)) <= k && hkey(parseH(p.to)) >= k);
    const starts = act.filter(p => hkey(parseH(p.from)) === k), ends = act.filter(p => hkey(parseH(p.to)) === k);
    const g = H2G[y + '/' + m + '/' + d]; const gd = g != null ? new Date(g) : null;
    cells += `<div class="cd ${wd >= 5 ? 'we' : ''} ${act.length ? 'act' : ''} ${k === TK ? 'today' : ''} ${S.cal.sel === d ? 'sel' : ''}" data-day="${d}"><b>${ar(d)}</b><em class="wdn">${WD[wd]}</em><small>${gd ? ar(gd.getUTCDate()) + ' ' + GM[gd.getUTCMonth()] : ''}</small>${act.length ? `<span class="cnt">${ar(act.length)}</span>` : ''}<div class="dots">${starts.slice(0, 5).map(p => `<i style="--dc:${domOf(p).color}"></i>`).join('')}${starts.length > 5 ? '<em>+' + ar(starts.length - 5) + '</em>' : ''}${ends.length ? `<em>تنتهي ${ar(ends.length)}</em>` : ''}</div></div>`;
  }
  let list = '';
  if (S.cal.sel) {
    const d = S.cal.sel, k = keyOf(d), ds = y + '/' + m + '/' + d;
    const act = S.programs.filter(p => hkey(parseH(p.from)) <= k && hkey(parseH(p.to)) >= k).sort(sortP);
    const grp = (t, l) => l.length ? `<h4>${t} (${ar(l.length)})</h4>${l.map(p => liProg(p)).join('')}` : '';
    list = `<section class="card cal-l"><h3>${fmtHW(ds)} · ${greg(ds)}</h3>${act.length ? grp('تبدأ اليوم', act.filter(p => p.from === ds)) + grp('تنتهي اليوم', act.filter(p => p.to === ds && p.from !== ds)) + grp('جارية', act.filter(p => p.from !== ds && p.to !== ds)) : '<p class="empty">لا توجد برامج في هذا اليوم.</p>'}</section>`;
  }
  return `<div class="card"><div class="cal-h"><button class="btn sm" data-act="cal-next" aria-label="الشهر التالي">›</button><h2 style="text-align:center">${MONTHS[m - 1]} ${ar(y)}هـ<small>${monthGreg(y, m)} · تقويم أم القرى</small></h2><button class="btn sm" data-act="cal-prev" aria-label="الشهر السابق">‹</button></div>
  <div style="text-align:center;margin-bottom:10px"><button class="btn sm" data-act="cal-today">اليوم</button></div>
  <div class="cal">${cells}</div><p class="hint">الأيام الملونة فيها برامج، والنقاط الملونة تدل على برامج تبدأ في ذلك اليوم بلون مجالها، واضغط اليوم لعرض برامجه.</p></div>${list}`;
}

/* ============ سجل الشواهد ============ */
function viewEv() {
  const f = S.evf || (S.evf = { d: '', k: '', q: '' });
  let list = S.evidence.filter(e => { const p = S.programs.find(x => x.id === e.program_id); if (!p) return false; if (f.d && String(p.domain) !== f.d) return false; if (f.k && e.kind !== f.k) return false; if (f.q && !(e.title + ' ' + (e.note || '') + ' ' + p.name + ' ' + (e.added_by || '')).toLowerCase().includes(f.q.toLowerCase())) return false; return true; });
  const o = (v, t, c) => `<option value="${v}"${c === v ? ' selected' : ''}>${t}</option>`;
  return `<div class="tools card"><input id="e-q" type="search" placeholder="ابحث في الشواهد…" value="${esc(f.q)}"><select id="e-d">${o('', 'كل المجالات', f.d)}${PLAN.domains.map(d => o(String(d.n), d.title, f.d)).join('')}</select><select id="e-k">${o('', 'كل الأنواع', f.k)}${KINDS.map(k => o(k, k, f.k)).join('')}</select></div>
  <div class="acts"><button class="btn" data-act="csv-ev">${ico('down', 17)} تصدير فهرس الشواهد (Excel)</button></div>
  <div id="evlist">${evListHTML(list)}</div>`;
}
function evListHTML(list) { return list.length ? list.slice(0, 200).map(e => { const p = S.programs.find(x => x.id === e.program_id); return `<div style="--dc:${domOf(p).color}">${evItem(e, p)}</div>`; }).join('') + (list.length > 200 ? '<p class="empty">يُعرض أحدث ٢٠٠ شاهد، استخدم البحث للوصول لغيرها.</p>' : '') : '<div class="card empty">لا توجد شواهد مطابقة.</div>'; }
function paintEv() {
  const f = S.evf; const list = S.evidence.filter(e => { const p = S.programs.find(x => x.id === e.program_id); if (!p) return false; if (f.d && String(p.domain) !== f.d) return false; if (f.k && e.kind !== f.k) return false; if (f.q && !(e.title + ' ' + (e.note || '') + ' ' + p.name + ' ' + (e.added_by || '')).toLowerCase().includes(f.q.toLowerCase())) return false; return true; });
  const el = $('#evlist'); if (el) el.innerHTML = evListHTML(list);
}
const canDel = e => S.admin || e.device === DEVICE;
function evItem(e, prog) {
  const th = API.thumb(e), isImg = /^image\//.test(e.mime || '');
  const when = e.event_date ? fmtHW(e.event_date) : fmtHW(hstr(uq(Date.parse(e.created_at) - Date.parse(e.created_at) % 864e5) || TODAY));
  return `<div class="ev"><div class="ev-th">${th ? `<img loading="lazy" src="${esc(th)}" alt="">` : ico(isImg ? 'img' : (e.file_path ? 'file' : 'link'), 26)}</div>
  <div class="ev-b"><b>${esc(e.title)}</b><small>${esc(e.kind || '')}${e.file_name ? ' · ' + esc(e.file_name) + (e.size ? ' · ' + fsize(e.size) : '') : (e.link ? ' · رابط' : '')}</small>
  <small>${prog ? esc(prog.name) + ' · ' : ''}أضافه ${esc(e.added_by || '—')} · ${when}</small>${e.note ? `<p>${esc(e.note)}</p>` : ''}</div>
  <div class="ev-a"><button class="btn sm" data-act="ev-view" data-id="${esc(e.id)}">عرض</button>${canDel(e) ? `<button class="btn sm danger" data-act="ev-del" data-id="${esc(e.id)}" aria-label="حذف">${ico('trash', 15)}</button>` : ''}</div></div>`;
}

/* ============ نافذة البرنامج ============ */

  const s = st(p.id), cur = curOf(p), a = ach(p), g = rangeG(p);
  return `<dl class="dl"><div class="full"><dt>الفترة (تقويم أم القرى)</dt><dd>${rangeH(p)}${g ? `<small>${g}</small>` : ''}</dd></div>
  <div><dt>الفصل الدراسي</dt><dd>${p.sem === 1 ? 'الأول' : 'الثاني'}</dd></div><div><dt>المعيار</dt><dd>${esc(p.std)} <bdi dir="ltr">(${esc(p.code || '')})</bdi></dd></div>
  <div><dt>المستهدفون</dt><dd>${tx(p.who)}</dd></div><div><dt>أسلوب التنفيذ</dt><dd>${tx(p.how)}</dd></div>
  <div><dt>الجهة الرئيسة</dt><dd>${esc(p.lead)}</dd></div><div><dt>الجهة المساندة</dt><dd>${esc(p.sup)}</dd></div>
  <div class="full"><dt>مؤشر الإنجاز</dt><dd>${tx(p.ind)}</dd></div></dl>

  <div class="bar big"><i style="width:${a}%"></i></div><div class="nums"><span>نسبة الإنجاز من المستهدف</span><b>${p0(a)}</b></div>
  <p class="hint">${p.low ? 'في هذا البرنامج كلما انخفضت النسبة كان ذلك أفضل، فتُحسب نسبة الإنجاز بمقدار الانخفاض عن خط الأساس (' + p1(p.base) + ') نحو المستهدف.' : 'نسبة الإنجاز = النسبة الحالية ÷ المستهدف.'}</p>
  <label>ملاحظات المتابعة<textarea id="i-note">${esc(s.note || '')}</textarea></label>

function uploadReportFiles(id) {

    const room = RP_MAX - evOf(id).filter(e => e.kind === 'شاهد تقرير').length;
    if (room <= 0) return toast('وصلت إلى الحد الأقصى وهو ' + ar(RP_MAX) + ' شواهد للتقرير', true);

      try {
        const f = await maybeCompress(f0);

async function maybeCompress(f) {

    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
    if (blob && blob.size < f.size) return new File([blob], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { }
  return f;
}

    case 'pin-ok': { if ($('#pin').value === String(CFG.ADMIN_PIN)) { S.admin = true; sessionStorage.setItem('sh_admin', '1'); const then = S.dlg && S.dlg.then; S.dlg = null; renderDlg(); if (then) then(); render(); toast('وضع المشرف مفعّل'); } else toast('الرمز غير صحيح', true); break; }
    case 'copy-sql': { const ok = await copyText(SETUP_SQL); toast(ok ? 'تم نسخ أمر الإعداد، الصقه في محرر SQL' : 'تعذّر النسخ تلقائياً، انسخه من ملف supabase-setup.sql', !ok); break; }
    case 'retry-load': { busy('جاري التحقق…'); await loadAll(); busy(false); render(); toast(S.setup ? 'الجداول ما زالت غير موجودة' : (S.err ? 'ما زالت هناك مشكلة في الاتصال' : 'تم الاتصال بقاعدة البيانات بنجاح'), !!(S.setup || S.err)); break; }
    case 'save-info': saveInfo(id); break;
    case 'save-msr': saveMsr(id); break;
    case 'adopt-post': adoptPost(id); break;
    case 'ev-pick': $('#ev-file').click(); break;
    case 'ev-cam': $('#ev-cam').click(); break;
    case 'ev-rm': PICKED.splice(+el.dataset.i, 1); $('#picked').innerHTML = pickedHTML(); break;
    case 'ev-submit': submitEv(id); break;
    case 'ev-view': viewEv_(id); break;
    case 'ev-del': delEv(id); break;
    case 'edit-prog': needAdmin(() => { S.dlg = { t: 'edit', id }; renderDlg(); }); break;
    case 'add-prog': { const dm = +el.dataset.d; needAdmin(() => { S.dlg = { t: 'edit', id: null, domain: dm }; renderDlg(); }); break; }
    case 'save-prog': saveProg(id); break;
    case 'del-prog': needAdmin(() => delProg(id)); break;
    case 'restore': needAdmin(restorePlan); break;
    case 'report': location.hash = '#/r/' + encodeURIComponent(id); break;
    case 'save-report': saveReport(id); break;
    case 'rp-ai-goals': { const el = $('#rp-goals'), p = S.programs.find(x => x.id === S.rid); if (el && p) { el.value = autoGoals(p); toast('تم توليد الأهداف، راجعها ثم احفظ التقرير'); } break; }
    case 'rp-ai-desc': { const el = $('#rp-desc'), p = S.programs.find(x => x.id === S.rid); if (el && p) { el.value = autoDesc(p); toast('تم توليد التوصيف، راجعه ثم احفظ التقرير'); } break; }
    case 'rp-camera': $('#rp-cam').click(); break;
    case 'rp-clear': RPICK = []; rpShowPicked(); break;
    case 'rp-upload': uploadReportFiles(id); break;
    case 'print-report': window.print(); break;
    case 'rp-word': exportReportWord(id); break;
    case 'rp-excel': { const p = S.programs.find(x => x.id === id); if (p) csvPrograms([p], 'تقرير-' + p.name.slice(0, 60) + '.csv'); break; }
    case 'logout': try { localStorage.removeItem(AUTH_KEY); } catch (x) {} location.reload(); break;
    case 'print': printDomain(+el.dataset.d); break;
    case 'csv-d': csvPrograms(S.programs.filter(p => p.domain === +el.dataset.d), 'شواهدي-' + PLAN.domains[+el.dataset.d - 1].title + '.csv'); break;
    case 'csv-all': csvPrograms(S.programs, 'شواهدي-كل-البرامج.csv'); break;
    case 'csv-ev': csvEvidence(); break;
    case 'cal-prev': S.cal.m--; if (S.cal.m < 1) { S.cal.m = 12; S.cal.y--; } S.cal.sel = null; render(); break;
    case 'cal-next': S.cal.m++; if (S.cal.m > 12) { S.cal.m = 1; S.cal.y++; } S.cal.sel = null; render(); break;
    case 'cal-today': S.cal = { y: TODAY.y, m: TODAY.m, sel: TODAY.d }; render(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { S.f.q = e.target.value; paintDyn(); }
  else if (e.target.id === 'e-q') { S.evf.q = e.target.value; paintEv(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-sem') { S.f.sem = t.value; paintDyn(); }
  else if (t.id === 'f-tl') { S.f.tl = t.value; paintDyn(); }
  else if (t.id === 'f-ev') { S.f.ev = t.value; paintDyn(); }
  else if (t.id === 'e-d') { S.evf.d = t.value; paintEv(); }
  else if (t.id === 'e-k') { S.evf.k = t.value; paintEv(); }
  else if (t.id === 'ev-file' || t.id === 'ev-cam') { pickFiles(t.files); t.value = ''; }
  else if (t.id === 'rp-f-d') { S.repf = Object.assign({ d: '', st: '' }, S.repf, { d: t.value }); render(); }
  else if (t.id === 'rp-f-st') { S.repf = Object.assign({ d: '', st: '' }, S.repf, { st: t.value }); render(); }
  else if (t.id === 'rp-file' || t.id === 'rp-cam') {
    const room = RP_MAX - evOf(S.rid).filter(e => e.kind === 'شاهد تقرير').length - RPICK.length;
    const added = [...t.files].filter(f => f.size <= CFG.MAX_FILE_MB * 1048576);
    if (added.length > Math.max(0, room)) toast('يمكن إضافة ' + ar(Math.max(0, room)) + ' ملفات فقط، وتم تجاهل الباقي', true);
    RPICK = RPICK.concat(added.slice(0, Math.max(0, room)));
    t.value = '';
    rpShowPicked();
  }
  else if (t.closest && t.closest('.hp')) { const hp = t.closest('.hp'); const g = k => hp.querySelector('[data-k="' + k + '"]').value; const s = g('y') + '/' + g('m') + '/' + g('d'); const l = hp.querySelector('.hp-l'); l.textContent = hpLabel(s); l.classList.toggle('bad', !validH(s)); }
  else if (t.id === 'pf-dom') { const k = +t.value; const dlst = $('#pf-stds'); if (dlst) dlst.innerHTML = [...new Set(PLAN.standards.filter(s => s.domain === k).map(s => s.title).concat(S.programs.filter(x => x.domain === k).map(x => x.std)))].map(x => `<option value="${esc(x)}"></option>`).join(''); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('hot'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('hot'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('hot'); pickFiles(e.dataTransfer.files); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.dlg) closeDlg(); else if (S.open) closeProg(); } if (e.key === 'Enter' && S.dlg && (S.dlg.t === 'pin' || S.dlg.t === 'name')) { const b = $('#dlgRoot .btn.pri'); if (b) b.click(); } });
window.addEventListener('hashchange', () => { S.open = null; S.dlg = null; routeNow(); });
let lastLoad = Date.now();
window.addEventListener('focus', () => { if (REMOTE && !S.open && !S.dlg && Date.now() - lastLoad > 30000) { lastLoad = Date.now(); loadAll().then(render); } });

function routeNow() {
  const h = location.hash.replace(/^#\/?/, '');
  const rm = h.match(/^r\/(.+)$/);
  if (rm) { S.route = 'r'; S.rid = decodeURIComponent(rm[1]); }
  else S.route = (/^d[1-4]$/.test(h) || h === 'ev' || h === 'cal' || h === 'rep') ? h : 'home';
  S.f.std = '';
  if (S.route === 'cal' && !S.cal.sel) S.cal = { y: TODAY.y, m: TODAY.m, sel: S.cal.sel };
  render(); window.scrollTo(0, 0);
}
async function loadAll() {
  try { const d = await API.load(); S.programs = d.programs; S.state = d.state; S.evidence = d.evidence; S.err = ''; S.setup = false; }
  catch (e) {
    const m = String((e && e.message) || e);
    S.setup = !!(e && (e.code === 'PGRST205' || e.code === '42P01')) || /schema cache|does not exist|Could not find the table/i.test(m);
    S.err = S.setup ? '' : 'تعذّر الاتصال بقاعدة البيانات: ' + m + ' — تأكد من صحة الإعدادات في config.js.';
    if (!S.programs.length) S.programs = buildPlan();
  }
  S.loading = false;
}
window.__SH = { S, buildPlan, validH, H2G };
render();
if (!(gateOn() && !authed())) loadAll().then(() => { routeNow(); startLive(); });
})();
</script>
</body>
</html>
