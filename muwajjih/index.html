<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>الموجه الطلابي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
/* الموجه الطلابي: ملفات الحالات، الجلسات، التواصل مع الأسر، الإحالات، البرامج الإرشادية والتقارير. يتشارك قاعدة بيانات راصد ويقرأ منها قائمة الطلاب وغيابهم. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#14202C; --muted:#5A6878; --line:#D9E1EA;
  --pri:#1F4E79; --pri-ink:#FFFFFF; --pri-soft:#E0EAF4;
  --gold:#9A6A00; --gold-soft:#F7ECCF;
  --red:#B3321F; --red-soft:#F8E2DD;
  --ok:#1B7A44; --ok-soft:#DDF0E4;
  --vio:#6B3FA0; --vio-soft:#ECE3F6;
  --shade:rgba(10,18,28,.5);
  --f-display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C121A; --surface:#151F2B; --ink:#E4ECF4; --muted:#9AAABB; --line:#26364A;
    --pri:#7FB2E5; --pri-ink:#0A1A2B; --pri-soft:#18304A;
    --gold:#E8BC5A; --gold-soft:#3A2E12; --red:#FF9A89; --red-soft:#3B1F1A;
    --ok:#74D79F; --ok-soft:#16331F; --vio:#C3A2EE; --vio-soft:#2C2140;
    --shade:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C121A; --surface:#151F2B; --ink:#E4ECF4; --muted:#9AAABB; --line:#26364A;
  --pri:#7FB2E5; --pri-ink:#0A1A2B; --pri-soft:#18304A;
  --gold:#E8BC5A; --gold-soft:#3A2E12; --red:#FF9A89; --red-soft:#3B1F1A;
  --ok:#74D79F; --ok-soft:#16331F; --vio:#C3A2EE; --vio-soft:#2C2140;
  --shade:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body);padding-bottom:96px;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.in{max-width:900px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.muted{color:var(--muted)} .sm{font-size:13px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.mast{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--pri-ink);padding-top:env(safe-area-inset-top,0px)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.school{font-size:12px;opacity:.9}
.mast h1{font-size:20px;line-height:1.35}
.mc{display:flex;gap:8px;align-items:center}
.gsel,.gbtn{min-height:40px;padding:0 10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;font-size:13.5px;font-weight:600}
.gsel option{color:var(--ink);background:var(--surface)}
.demo{background:var(--gold-soft);color:var(--gold);font-size:13px;padding:6px 0}

#page{padding-top:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card>h2,.hd2{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:700 26px/1.2 var(--f-display);color:var(--pri)}
.tile span{font-size:13px;color:var(--muted)}
.tile.warn b{color:var(--red)}
.qa{display:flex;gap:8px;flex-wrap:wrap}

.btn{min-height:44px;padding:0 16px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.lnk{background:none;border:0;color:var(--pri);font-weight:600;padding:4px;font-size:13.5px}

input,textarea,select.in-s{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.hp{display:flex;gap:6px}
.hp select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 4px;font-size:14.5px;min-width:0}
.hp select[data-p=d]{flex:0 0 110px}.hp select[data-p=m]{flex:1 1 90px}.hp select[data-p=y]{flex:0 0 72px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:40px;border:0;background:transparent;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);font-weight:600}

.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
.it:first-child{border-top:0}
button.it:hover{background:var(--pri-soft)}
.it .m{min-width:0;flex:1}
.it .t{font-weight:600}
.it .s{font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bdg{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600;white-space:nowrap;margin-inline-start:4px}
.b-open{background:var(--red-soft);color:var(--red)}
.b-follow{background:var(--gold-soft);color:var(--gold)}
.b-closed{background:var(--ok-soft);color:var(--ok)}
.b-v{background:var(--vio-soft);color:var(--vio)}
.k-ind{border-inline-start:4px solid var(--pri)}
.k-grp{border-inline-start:4px solid var(--vio)}
.k-par{border-inline-start:4px solid var(--ok)}
.k-ref{border-inline-start:4px solid var(--red)}
.k-pln,.k-pld{border-inline-start:4px solid var(--gold)}
.k-obs,.k-awr{border-inline-start:4px solid var(--muted)}
.tl{display:grid;gap:8px}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ent .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ent p{margin:4px 0 0;white-space:pre-wrap}
.ent .acts{display:flex;gap:4px;justify-content:flex-end}

.nav{position:fixed;inset:auto 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;min-height:62px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button[aria-current=page]{color:var(--pri);font-weight:700}

#sheet{position:fixed;inset:0;z-index:40}
#sheet .back{position:absolute;inset:0;background:var(--shade)}
#sheet .pan{position:absolute;inset:auto 0 0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){#sheet .pan{inset:4vh auto auto 50%;transform:translateX(-50%);width:720px;border-radius:18px;max-height:92vh}}
.sh-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.sh-h h2{font-size:17px}
.sh-b{padding:14px 16px;display:grid;gap:12px}
.x{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px}

#auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.acard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:12px;text-align:center}
.acard h1{font-size:28px;color:var(--pri)}
.err{color:var(--red);min-height:1.4em;margin:0;font-size:14px}
.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px}
.rem input{width:auto;min-height:0}

#toast{position:fixed;inset:auto 16px calc(80px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast div{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:560px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast button{background:none;border:0;color:var(--gold-soft);font-weight:700;text-decoration:underline}
.att{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.att span{padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.prog .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--pri)}
.hint{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 200px;width:auto}

/* الطباعة */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.rp{font:13px/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#000;direction:rtl}
.rp .hdimg{width:100%;display:block;margin-bottom:6px}
.rp .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1F4E79;padding-bottom:6px;margin-bottom:10px;font-size:12px}
.rp h1{font-size:18px;text-align:center;margin:6px 0 10px;color:#1F4E79}
.rp h3{font-size:14px;margin:12px 0 6px;color:#1F4E79}
.rp table{width:100%;border-collapse:collapse;margin:6px 0}
.rp th,.rp td{border:1px solid #888;padding:4px 6px;text-align:right;vertical-align:top}
.rp th{background:#E0EAF4}
.rp .sig{margin-top:28px}
.rp .sig td{border:0;text-align:center;width:33%}
.rp .box{border:1px solid #888;min-height:60px;padding:6px}
.rp p{margin:6px 0}
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- إعدادات ---------- */
const CFG={url:'https://hzehstsfxoximwzywvcp.supabase.co',key:'sb_publishable_UOTPFjgoBjQAifIATrkMeg_GFzQT88k'};
const EMAIL='alzobearschool2030@gmail.com',T='hisr_docs';
const SCHOOL='مدرسة الزبير بن العوام الابتدائية';
const YEARS=[1448,1449,1450,1451,1452,1453,1454,1455,1456,1457];
const MN=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const KINDS={
  ind:{t:'جلسة إرشاد فردي',s:'جلسة فردية'},
  par:{t:'تواصل مع ولي الأمر',s:'تواصل مع الأسرة',sub:['اتصال هاتفي','رسالة نصية','استدعاء حضوري','اجتماع عن بعد','زيارة منزلية']},
  ref:{t:'إحالة',s:'إحالة',sub:['لجنة التوجيه الطلابي','وكيل شؤون الطلاب','الموجه الصحي','معلم المادة','برنامج صعوبات التعلم','منسق الموهوبين','الوحدة الصحية','جهة مختصة خارج المدرسة']},
  pln:{t:'خطة علاجية / تعديل سلوك',s:'خطة علاجية'},
  pld:{t:'تعهد',s:'تعهد',sub:['تعهد من الطالب','تعهد من ولي الأمر','تعهد من الطالب وولي الأمر']},
  obs:{t:'ملاحظة متابعة',s:'متابعة'},
  grp:{t:'جلسة إرشاد جمعي',s:'إرشاد جمعي'},
  awr:{t:'برنامج توعوي / وقائي',s:'برنامج توعوي'}
};
const STU_KINDS=['ind','par','ref','pln','pld','obs'];
const CATS=['سلوكي','تأخر دراسي','اجتماعي وأسري','نفسي وانفعالي','صحي','غياب وتأخر','تنمر','حماية وإيذاء','موهبة وتفوق','صعوبات تعلم'];
const ST={open:'مفتوحة',follow:'تحت المتابعة',closed:'مغلقة'};
const PR={h:'عالية',m:'متوسطة',l:'منخفضة'};
const FU=[['','بلا متابعة'],[3,'بعد 3 أيام'],[7,'بعد أسبوع'],[14,'بعد أسبوعين'],[30,'بعد شهر']];

/* ---------- أدوات ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().trim();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const nd=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();

/* تقويم أم القرى */
let HT=null;
function buildHT(){
  if(HT)return HT;HT={g:new Map(),h:new Map(),ok:false};
  try{
    const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
    for(let t=Date.UTC(2025,5,1);t<=Date.UTC(2038,11,31);t+=86400000){
      const o={};f.formatToParts(new Date(t)).forEach(p=>{if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=parseInt(p.value,10)});
      const k=new Date(t).toISOString().slice(0,10);HT.g.set(k,[o.year,o.month,o.day]);HT.h.set(o.year+'-'+o.month+'-'+o.day,k);
    }
    const z=HT.g.get('2026-11-02');HT.ok=!!z&&z[0]>1440&&z[0]<1460;
  }catch(e){HT.ok=false}
  return HT;
}
const g2h=s=>{buildHT();return HT.ok?(HT.g.get(s)||null):null};
const h2g=(y,m,d)=>{buildHT();return HT.ok?(HT.h.get(y+'-'+m+'-'+d)||null):null};
const wd=s=>{try{return DAYS[parseD(s).getDay()]}catch(e){return ''}};
function fmt(s){const h=g2h(s);return h?wd(s)+' '+h[2]+' '+MN[h[1]-1]+' '+h[0]+'هـ':s}
function fmtS(s){const h=g2h(s);return h?h[2]+' '+MN[h[1]-1]:s}
function hs(s){const h=g2h(s);return h?h[0]+'/'+pad(h[1])+'/'+pad(h[2]):s}
function fmtG(s){try{return parseD(s).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'})+'م'}catch(e){return s}}
function hYearNow(){const h=g2h(today());if(!h)return YEARS[0];/* العام الدراسي يبدأ في ربيع الأول تقريباً */const y=h[1]<3?h[0]-1:h[0];return Math.min(Math.max(y,YEARS[0]),YEARS[YEARS.length-1])}
/* أشهر العام الدراسي: من ربيع الأول حتى صفر من العام التالي */
function schoolMonths(Y){const o=[];for(let i=0;i<12;i++){const m=3+i;o.push(m>12?[Y+1,m-12]:[Y,m])}return o}

let SB=null;

const Local={
  all(){try{return JSON.parse(localStorage.getItem('mw_local')||'{}')}catch(e){return {}}},
  save(o){try{localStorage.setItem('mw_local',JSON.stringify(o))}catch(e){toast('تعذّر الحفظ على الجهاز')}}
};
const Store={
  async list(path){
    const n=path.split('/').length+1;
    if(S.mode==='local'){const a=Local.all();return Object.keys(a).filter(p=>p.indexOf(path+'/')===0&&p.split('/').length===n).map(p=>({id:p.split('/').pop(),data:a[p]}))}
    let out=[],from=0;
    for(;;){const {data,error}=await SB.from(T).select('path,data').like('path',path+'/%').range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
    return out.filter(r=>r.path.split('/').length===n).map(r=>({id:r.path.split('/').pop(),data:r.data||{}}));
  },
  async set(path,id,data){
    if(S.mode==='local'){const a=Local.all();a[path+'/'+id]=data;Local.save(a);return}
    const {error}=await SB.from(T).upsert({path:path+'/'+id,data,updated_at:new Date().toISOString()});if(error)throw error;
  },
  async del(path,id){
    if(S.mode==='local'){const a=Local.all();delete a[path+'/'+id];Local.save(a);return}
    const {error}=await SB.from(T).delete().eq('path',path+'/'+id);if(error)throw error;
  }
};

let loading=false,pollT=null;
async function load(quiet){
  if(loading)return;loading=true;
  try{
    const [r,f,l,s]=await Promise.all([Store.list(P.roster()),Store.list(P.files()),Store.list(P.log()),Store.list(P.set())]);
    const R={};r.forEach(x=>{R[x.id]={name:x.data.name||'',cls:x.data.cls||'',abs:x.data.abs||{},late:x.data.late||{}}});
    const F={};f.forEach(x=>F[x.id]=x.data);
    const L={};l.forEach(x=>L[x.id]=Object.assign({id:x.id},x.data));
    const sig=JSON.stringify([R,F,L,s]);
    if(sig!==S.sig){S.sig=sig;S.roster=R;S.files=F;S.log=L;S.set=(s.find(x=>x.id==='main')||{data:{}}).data;render()}
  }catch(e){if(!quiet)toast('تعذّر تحميل البيانات، تحقق من الاتصال.');if(e&&/JWT|auth/i.test(e.message||''))logout()}
  loading=false;
}

function stu(sid){const r=S.roster[sid],f=S.files[sid];return {sid,name:(f&&f.name)||(r&&r.name)||'—',cls:(f&&f.cls)||(r&&r.cls)||'',r,f}}
function absOf(sid){
  const r=S.roster[sid];const o={u:0,e:0,late:0};if(!r)return o;
  Object.values(r.abs||{}).forEach(t=>{if(t==='u'||t==='e')o[t]++});
  Object.values(r.late||{}).forEach(v=>{if(v)o.late++});
  return o;
}
const entriesOf=sid=>Object.values(S.log).filter(e=>e.sid===sid).sort((a,b)=>(b.d||'').localeCompare(a.d||'')||(b.at||0)-(a.at||0));
const allEntries=()=>Object.values(S.log).sort((a,b)=>(b.d||'').localeCompare(a.d||'')||(b.at||0)-(a.at||0));
const dueFollow=()=>Object.values(S.log).filter(e=>e.fu&&!e.fuDone&&e.fu<=addDays(today(),2)).sort((a,b)=>a.fu.localeCompare(b.fu));
function allSids(){return [...new Set(Object.keys(S.roster).concat(Object.keys(S.files)))]}
const GO=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
function classes(){const gk=c=>{const i=GO.findIndex(g=>c.indexOf(g)===0);return (i<0?9:i)*100+(parseInt((c.match(/\d+/)||[0])[0],10)||0)};return [...new Set(allSids().map(s=>stu(s).cls).filter(Boolean))].sort((a,b)=>gk(a)-gk(b)||a.localeCompare(b,'ar'))}
function attention(){
  return Object.keys(S.roster).map(sid=>({sid,a:absOf(sid)})).filter(x=>(!S.files[x.sid]||S.files[x.sid].st==='closed')&&(x.a.u>=3||x.a.e>=5||x.a.late>=4))
    .sort((a,b)=>(b.a.u*2+b.a.e+b.a.late)-(a.a.u*2+a.a.e+a.a.late));
}
/* برامج الموجه في الخطة التشغيلية (شواهدي) */
function guidePrograms(){
  const P0=window.PLAN;if(!P0)return [];
  const G='الموجه الطلابي';
  const pd=(s,def)=>{const p=String(s).split('/').map(Number);return p.length===3?h2g(p[0],p[1],p[2]):h2g(def,p[0],p[1])};
  return P0.rows.filter(r=>String(r[8]).includes(G)||String(r[9]).includes(G)).map(r=>{
    const y=1448,from=pd(r[4],y)||'',to=pd(r[5],y)||from;
    return {key:'p'+r[0]+'-'+r[1],sem:r[0],no:r[1],name:r[3],from,to,who:r[6],how:r[7],lead:r[8],sup:r[9],ind:r[10],main:String(r[8]).includes(G)};
  }).sort((a,b)=>a.from.localeCompare(b.from));
}

  const a=b.dataset.act;
  if(a==='go'){closeSheet();go(b.dataset.p);return}
  if(a==='close'){const back=S.ret,kind=S.sheet;closeSheet();S.ret=null;if(back&&kind!=='stu')openStudent(back);return}
  if(a==='undo'){const u=S.undo;$('#toast').hidden=true;S.undo=null;if(u)u();return}
  if(a==='logout'){logout();return}
  if(a==='demo'){startLocal();return}
  if(a==='stu'){S.ret=null;openStudent(b.dataset.sid);return}
  if(a==='sf'){S.sf=b.dataset.v;pStudents();return}
  if(a==='lk'){S.lk=b.dataset.k;pLog();return}
  if(a==='newent'){
    const sid=b.dataset.sid||'';S.ret=sid||null;
    openEntry({kind:b.dataset.k,sid,d:today()});return;
  }
  if(a==='edent'){const e=S.log[b.dataset.id];if(!e)return;S.ret=S.sheet==='stu'?S.sid:null;openEntry(Object.assign({},e));return}
  if(a==='delent'){
    const id=b.dataset.id,e=S.log[id];if(!e||!confirm('حذف هذا الإجراء؟'))return;
    try{await Store.del(P.log(),id);delete S.log[id];S.sig='';render();toast('حُذف الإجراء',async()=>{const c=Object.assign({},e);delete c.id;await Store.set(P.log(),id,c).catch(fail);S.log[id]=e;S.sig='';render()})}catch(x){fail(x)}
    return;
  }
  if(a==='fudone'){const e=S.log[b.dataset.id];if(!e)return;const c=Object.assign({},e,{fuDone:true});delete c.id;try{await Store.set(P.log(),e.id,c);e.fuDone=true;S.sig='';render();toast('سُجّلت المتابعة')}catch(x){fail(x)}return}
  if(a==='openfile'){try{await saveFile(S.sid,{});openStudent(S.sid,true);render();toast('فُتح ملف الحالة')}catch(x){fail(x)}return}
  if(a==='tcat'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');return}
  if(a==='savefile'){
    const cats=$$('#fcats .chip').filter(c=>c.getAttribute('aria-pressed')==='true').map(c=>c.textContent);
    try{await saveFile(S.sid,{cats,st:$('#fst').value,pr:$('#fpr').value,sum:$('#fsum').value.trim(),plan:$('#fplan').value.trim(),par:$('#fpar').value.trim()});toast('حُفظ ملف الحالة');document.activeElement&&document.activeElement.blur();openStudent(S.sid,true);render()}catch(x){fail(x)}
    return;
  }
  if(a==='delfile'){
    const sid=S.sid,f=S.files[sid];if(!f||!confirm('حذف ملف الحالة؟ تبقى الإجراءات المسجلة للطالب.'))return;
    try{await Store.del(P.files(),sid);delete S.files[sid];S.sig='';render();openStudent(sid,true);toast('حُذف الملف',async()=>{await Store.set(P.files(),sid,f).catch(fail);S.files[sid]=f;S.sig='';render()})}catch(x){fail(x)}
    if(!S.roster[sid])closeSheet();
    return;
  }
  if(a==='prcase'){output(buildReport('case',S.sid),'print');return}
  if(a==='form'){const sid=S.sid;S.ret=sid;formFor(b.dataset.f,sid);return}
  if(a==='fout'){output(buildReport(b.dataset.f,S.formStu),b.dataset.o);return}
  if(a==='rstu'){const sid=$('#rstu').value;if(!sid){toast('لا توجد ملفات حالات بعد');return}S.ret=null;formFor(b.dataset.f,sid);return}
  if(a==='rep'){output(buildReport(b.dataset.r,$('#rmsel')?$('#rmsel').value:''),b.dataset.o);return}
  if(a==='addstu'){
    openSheet('إضافة طالب غير مدرج','<form id="fstu" class="sh-b" style="padding:0"><label class="fld"><span>اسم الطالب</span><input id="nn" required></label><label class="fld"><span>الفصل</span><input id="nc" placeholder="مثال: الرابع 2"></label><button class="btn block" type="submit">إضافة وفتح ملف</button></form>','add');return;
  }
  if(a==='docprog'){
    const p=guidePrograms().find(x=>x.key===b.dataset.k);if(!p)return;
    S.ret=null;openEntry({kind:'awr',title:p.name,pk:p.key,d:today(),note:p.how});return;
  }
  if(a==='saveset'){
    const s={counselor:$('#scn').value.trim(),deputy:$('#sdp').value.trim(),principal:$('#spr').value.trim()};
    try{await Store.set(P.set(),'main',s);S.set=s;S.sig='';toast('حُفظت الإعدادات')}catch(x){fail(x)}return;
  }
  if(a==='backup'){
    const data=JSON.stringify({app:'muwajjih',year:S.year,at:new Date().toISOString(),files:S.files,log:S.log,settings:S.set},null,1);
    const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='الموجه-الطلابي-'+S.year+'-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sq'){S.q=t.value;pStudents();return}
  if(t.id==='esf'){const q=norm(t.value),sel=$('#esid'),cur=sel.value;sel.innerHTML=stuOptions(cur);if(q)[...sel.options].forEach(o=>{if(o.value&&o.value!==cur&&!norm(o.textContent).includes(q))o.remove()});if(q&&!cur&&sel.options.length>1)sel.selectedIndex=1;return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ysel'){S.year=parseInt(t.value,10);LS.set('mw_y',String(S.year));S.sig='';S.cls='';S.lm='';S.rm='';closeSheet();load();return}
  if(t.id==='clssel'){S.cls=t.value;pStudents();return}
  if(t.id==='lmsel'){S.lm=t.value;pLog();return}
  if(t.id==='rmsel'){S.rm=t.value;return}
  if(t.id==='ek'&&S.ed){
    /* حفظ ما كُتب ثم إعادة بناء النموذج للنوع الجديد */
    const e=S.ed;e.kind=t.value;e.note=$('#enote').value;e.out=$('#eout').value;e.d=hpVal('ed');if($('#ett'))e.title=$('#ett').value;if($('#esid'))e.sid=$('#esid').value||e.sid;
    $('#shT').textContent=e.id?'تعديل إجراء':KINDS[e.kind].t;$('#shB').innerHTML=entryForm(e);return;
  }
  if(t.matches&&t.matches('.hpfb')){const hp=t.closest('.hp');if(t.value)hp.dataset.v=t.value;return}
  const sel=t.closest&&t.closest('.hp select');if(!sel)return;
  const hp=sel.closest('.hp'),q=p=>+hp.querySelector('[data-p='+p+']').value;
  const y=q('y'),m=q('m');let d=q('d'),v=h2g(y,m,d);while(!v&&d>28){d--;v=h2g(y,m,d)}if(!v)return;
  const sd=hp.querySelector('[data-p=d]');sd.innerHTML=dayOpts(y,m,d);sd.value=d;hp.dataset.v=v;
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='fent'){const btn=e.target.querySelector('[type=submit]');btn.disabled=true;await submitEntry();btn.disabled=false;return}
  if(e.target.id==='fstu'){
    const name=$('#nn').value.trim(),cls=$('#nc').value.trim();if(!name)return;
    const sid='m_'+uid();try{await saveFile(sid,{name,cls});closeSheet();render();openStudent(sid)}catch(x){fail(x)}return;
  }
  if(e.target.id==='flogin'){
    const btn=e.target.querySelector('[type=submit]');btn.disabled=true;$('#aerr').textContent='';
    try{
      const {error}=await SB.auth.signInWithPassword({email:EMAIL,password:nd($('#lp').value)});
      if(error)$('#aerr').textContent=/fetch|network/i.test(error.message||'')?'تعذّر الاتصال، تحقق من الإنترنت.':'رمز الدخول غير صحيح.';
      else startRemote();
    }catch(x){$('#aerr').textContent='تعذّر الاتصال، تحقق من الإنترنت.'}
    btn.disabled=false;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});

/* ---------- الدخول ---------- */
function showAuth(){
  $('#shell').hidden=true;closeSheet();const a=$('#auth');a.hidden=false;
  a.innerHTML='<form class="acard" id="flogin"><img src="icon.svg" alt="" width="72" height="72" style="justify-self:center"><h1>الموجه الطلابي</h1><p style="margin:0" class="muted">'+SCHOOL+'<br>ملفات الحالات · الجلسات الإرشادية · التواصل مع الأسر · التقارير</p>'+
    (SB?'<label class="fld" style="text-align:start"><span>رمز الدخول (رمز راصد نفسه)</span><input id="lp" type="password" autocomplete="current-password" required></label><p class="err" id="aerr"></p><button class="btn" type="submit">دخول</button>':'<p class="err" id="aerr">تعذّر تحميل مكتبة الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم أعد فتح الصفحة.</p>')+
    '<button class="btn ghost" type="button" data-act="demo">تجربة على هذا الجهاز دون دخول</button></form>';
  if($('#lp'))$('#lp').focus();
}
function enterShell(){
  $('#auth').hidden=true;$('#shell').hidden=false;$('#demoBar').hidden=S.mode!=='local';
  $('#ysel').innerHTML=YEARS.map(y=>'<option value="'+y+'"'+(y===S.year?' selected':'')+'>'+y+'هـ</option>').join('');
  go(S.page);load();startPoll();
}
function startRemote(){S.mode='remote';LS.del('mw_mode');S.sig='';enterShell()}
function startLocal(){
  S.mode='local';LS.set('mw_mode','local');
  const a=Local.all();
  if(!Object.keys(a).some(p=>p.indexOf('years/')===0))seedDemo();
  S.sig='';enterShell();
}
async function logout(){
  clearInterval(pollT);
  if(S.mode==='remote'&&SB){try{await SB.auth.signOut()}catch(e){}}
  LS.del('mw_mode');S.mode=null;S.roster={};S.files={};S.log={};S.sig='';showAuth();
}
function seedDemo(){
  const a=Local.all(),Y=S.year,names=[['عبدالله محمد العتيبي','الرابع 1'],['فيصل خالد الحربي','الرابع 1'],['يوسف أحمد الجهني','الخامس 2'],['سلمان عمر المطيري','الخامس 1'],['محمد سعد الزهراني','السادس 1'],['تركي ناصر الرشيدي','السادس 2'],['عمر فهد السلمي','الثالث 1'],['أنس علي القرشي','الثاني 1'],['زياد حمد البلوي','الأول 2'],['ريان ماجد الصاعدي','الثالث 2']];
  const t=today(),d=n=>addDays(t,-n);
  names.forEach((n,i)=>{const abs={},late={};if(i===1){[3,4,5,9].forEach(k=>abs[d(k)]='u')}if(i===4){[2,8].forEach(k=>abs[d(k)]='e');[1,3,6,7,10].forEach(k=>late[d(k)]=true)}if(i===6){[1,2,3].forEach(k=>abs[d(k)]='u')}a['years/'+Y+'/students/s'+i]={name:n[0],cls:n[1],abs,late}});
  a['mw/'+Y+'/files/s2']={name:names[2][0],cls:names[2][1],st:'open',pr:'h',cats:['سلوكي','تنمر'],d:d(12),sum:'تكرار الخلافات مع زملائه في الفسحة واستخدام ألفاظ غير لائقة.',plan:'جلسات فردية أسبوعية، عقد سلوكي، تعزيز إيجابي عند الالتزام، وتواصل مع ولي الأمر كل أسبوعين.',par:'الأب'};
  a['mw/'+Y+'/files/s5']={name:names[5][0],cls:names[5][1],st:'follow',pr:'m',cats:['تأخر دراسي'],d:d(20),sum:'انخفاض مستواه في الرياضيات والقراءة.',plan:'إحالة لمعلم المادة لخطة علاجية ومتابعة شهرية.'};
  const L=[['ind','s2',d(12),'خلاف مع زميل','مقابلة أولى لفهم أسباب الخلاف، أبدى الطالب ندمه.','الاتفاق على عقد سلوكي.',7],['par','s2',d(10),'إبلاغ ولي الأمر','تم إبلاغ الأب بالخطة وأبدى تعاوناً.','',0,'اتصال هاتفي'],['pld','s2',d(9),'عقد سلوكي','','',0,'تعهد من الطالب وولي الأمر'],['ref','s5',d(19),'تدني التحصيل','','',30,'معلم المادة'],['grp','',d(5),'مهارات حل الخلافات','جلسة جمعية لطلاب الخامس.','',0,'',14],['awr','',d(3),'إخوة - لمناهضة التنمر','إذاعة مدرسية ومسابقة.','',0,'',300]];
  L.forEach((x,i)=>{const e={kind:x[0],d:x[2],title:x[3],note:x[4],out:x[5],at:Date.now()-i*1000};if(x[1]){e.sid=x[1];e.name=names[+x[1].slice(1)][0];e.cls=names[+x[1].slice(1)][1]}if(x[6])e.fu=addDays(x[2],x[6]),e.fuDone=false;if(x[7])e.sub=x[7];if(x[8])e.n=x[8];a['mw/'+Y+'/log/demo'+i]=e});
  Local.save(a);
}

/* ---------- البدء ---------- */
(async function boot(){
  if(LS.get('mw_mode')==='local'){startLocal();return}
  if(SB){try{const {data}=await SB.auth.getSession();if(data&&data.session){startRemote();return}}catch(e){}}
  showAuth();
})();
})();
</script>
